name: API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=ci
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=ci
      MONGODB_DB_NAME: do_campo_a_mesa_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Start MongoDB replica set
        run: |
          docker run --detach --name mongodb-ci --publish 127.0.0.1:27017:27017 \
            mongo:7 --replSet ci --bind_ip_all
          for attempt in {1..30}; do
            if docker exec mongodb-ci mongosh --quiet --eval \
              'rs.initiate({_id: "ci", members: [{_id: 0, host: "127.0.0.1:27017"}]})'; then
              break
            fi
            sleep 1
          done
          for attempt in {1..30}; do
            if docker exec mongodb-ci mongosh --quiet --eval \
              'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          docker logs mongodb-ci
          exit 1

      - name: Run API tests
        working-directory: api
        run: npm test

      - name: Prepare test database
        working-directory: api
        run: |
          npm run db:init
          npm run db:seed

      - name: Start API and wait for health check
        working-directory: api
        run: |
          npm start > api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: Run Bruno API collection
        working-directory: api
        run: npm run test:api
