        precoBase: 500
        incremento: 50
        dataInicio: 2030-11-03T10:00:00Z
        dataFim: 2030-11-03T11:00:00Z
      description:
        "Substituir os IDs por produtos próprios publicados e as datas por um intervalo futuro. Quantidades:
        múltiplos de 1 unidade, 100 g ou 0,5 kg/l; mínimo igual ao passo e máximo igual ao stock."
