  /reviews/{id}/denuncias:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [Avaliações]
      security: [{ bearerAuth: [] }]
      summary: Denuncia uma avaliação como comprador ou produtor
      description:
        "Papel: comprador ou produtor. Não exige compra. Não permite denunciar a própria avaliação. Cada conta pode
        denunciar uma avaliação uma vez, mesmo após republicação. Aceita avaliações publicadas ou denunciadas de alvos
        públicos. Regista autor, motivo e data atomicamente e passa o estado a denunciada, retirando a nota das listas,
        médias e filtros públicos até decisão administrativa. Motivos e denunciantes são privados e consultáveis apenas
        pela administração."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewReportInput"
      responses:
        "201":
          {
            description: Denúncia registada,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { mensagem: { type: string } },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Papel sem permissão ou avaliação própria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Avaliação inexistente ou alvo indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Denúncia repetida ou estado incompatível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /reviews/{id}/moderacao:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Avaliações]
      security: [{ bearerAuth: [] }]
      summary: Publica ou oculta uma avaliação como administrador
      description:
        "Papel: administrador. Motivo obrigatório ao ocultar. A referência à última decisão e atualizadoEm, quando
        enviado, são comparados atomicamente; uma decisão ou avaliação desatualizada devolve 409. A interface envia
        ambos para detetar novas denúncias durante a análise. Qualquer administrador pode republicar. Preserva
        classificação, comentário e denúncias."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewModerationInput"
      responses:
        "200":
          description: Avaliação moderada
          content:
            application/json:
              schema:
