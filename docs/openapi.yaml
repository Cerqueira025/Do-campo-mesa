openapi: 3.0.3
info:
  title: Do Campo à Mesa API
  version: 1.0.0
  description: >-
    API REST para autenticação, catálogo, encomendas, avaliações e leilões. O registo de produtor fica sempre pendente,
    independentemente de aprovações enviadas pelo cliente. Produtores pendentes ou rejeitados podem iniciar sessão e
    consultar a conta, mas recebem 403 ao criar, alterar ou apagar produtos e ao criar leilões. A aprovação atual é
    consultada na base de dados em cada pedido protegido, sem exigir novo login após uma decisão administrativa.
    Produtos, perfis e leilões de produtores não aceites são omitidos das listas públicas e devolvem 404 no detalhe.
    Apenas registos pendentes podem ser aprovados ou rejeitados, uma única vez. Produtos bloqueados administrativamente
    também ficam indisponíveis; repor remove apenas o bloqueio. Motivos e autoria das decisões só são acessíveis nas
    consultas administrativas. Pedidos POST, PUT e PATCH exigem um corpo que seja um objeto JSON; corpo ausente, null,
    arrays e valores primitivos devolvem 400. Um objeto vazio passa pela validação dos campos da operação. Campos
    desconhecidos mantêm o comportamento de cada endpoint. Em rotas protegidas, a validação comum do corpo ocorre depois
    da autenticação e autorização. O parser JSON é global: sintaxe inválida é rejeitada com 400 antes dessas
    verificações. As respostas de erro preservam o formato { erro: string }; falhas internas inesperadas devolvem 500.
servers:
  - url: /api
tags:
  - name: Administração
  - name: Saúde
  - name: Autenticação
  - name: Produtos
  - name: Produtores
  - name: Encomendas
  - name: Avaliações
  - name: Leilões
paths:
  /admin/backoffice/codes:
    post:
      tags: [Administração]
      summary: Emite um código de entrada de utilização única, válido por 60 segundos
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackofficeCodeInput"
      responses:
        "201":
          description: Código temporário; nunca contém o JWT
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Apenas administradores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Integração não configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /internal/backoffice/exchange:
    post:
      tags: [Administração]
      summary: Troca um código por autenticação entre servidores
      security: [{ backofficeSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackofficeExchangeInput"
      responses:
        "200":
          description: Autenticação com a expiração original
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, utilizador]
                properties:
                  token: { type: string }
                  expiresAt:
                    { type: integer, description: Instante Unix em segundos }
                  utilizador: { $ref: "#/components/schemas/UserPublic" }
        "400":
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Segredo incorreto ou código inválido, expirado ou consumido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Conta sem permissão atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
      description:
        Integração servidor a servidor usada pelo Laravel. Exige X-Backoffice-Secret e um código de uso único
        associado a state; não é um fluxo de login do browser. Nenhum segredo deve ser incluído na especificação ou nos
        exemplos.
  /admin/services:
    get:
      tags: [Administração]
      summary: Testa MongoDB e uma ligação Socket.io sem entrar num leilão
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Resultados independentes; um serviço pode ter falhado
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        [service, status, message, durationMs, checkedAt]
                      properties:
                        service: { type: string, enum: [mongodb, socketio] }
                        status: { type: string, enum: [ok, failure] }
                        message: { type: string }
                        durationMs: { type: integer }
                        checkedAt: { type: string, format: date-time }
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Apenas administradores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /health:
    get:
      tags: [Saúde]
      summary: Verifica se a API está disponível
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Regista um comprador ou produtor pendente de aprovação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Inicia sessão e devolve um JWT válido por duas horas
      description:
        Produtores pendentes ou rejeitados também podem iniciar sessão; o login não concede aprovação para publicar
        produtos ou criar leilões.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema:
                type: object
                required: [token, utilizador]
                properties:
                  token: { type: string }
                  utilizador: { $ref: "#/components/schemas/UserPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/recuperar-password:
    post:
      tags: [Autenticação]
      summary: Substitui a password pelo email na demonstração universitária
      description:
        Fluxo simplificado, sem autenticação, envio de email ou token de recuperação. Conhecer o email permite
        alterar a password da conta. Não é adequado para utilização pública real. Altera apenas o hash da password; os
        JWT já emitidos continuam válidos até expirar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Password atualizada, sem devolver dados da conta ou sessão
          content:
            application/json:
              schema:
                type: object
                required: [mensagem]
                properties:
                  mensagem: { type: string, example: Palavra-passe atualizada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/eu:
    get:
      tags: [Autenticação]
      security: [{ bearerAuth: [] }]
      summary: Valida a sessão e devolve os dados atuais da conta
      description:
        "Papel: comprador, produtor ou administrador. Consulta a conta na base de dados, incluindo o estado atual
        de aprovação de produtores pendentes, aceites ou rejeitados. Tokens expirados, inválidos ou de contas removidas
        devolvem 401. Nunca devolve passwords ou hashes."
      responses:
        "200":
          description: Utilizador autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          $ref: "#/components/responses/InternalError"
  /products:
    get:
      tags: [Produtos]
      summary: Pesquisa produtos publicados de produtores aprovados
      description: >-
        Cada parâmetro conhecido aceita um único valor; parâmetros repetidos devolvem 400. Filtros numéricos vazios, não
        finitos ou preços cuja conversão em cêntimos exceda o limite de inteiro seguro devolvem 400. page e limit exigem
        dígitos decimais positivos, com limit até 100; page e o deslocamento (page - 1) * limit não podem exceder
        9007199254740991. Parâmetros omitidos mantêm os defaults. q, categoria, localidade, epoca e produtorId vazios
        são ignorados; q composto apenas por espaços devolve 400. Parâmetros desconhecidos são ignorados.
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: "Pesquisa sem distinção de maiúsculas em produto, categoria e produtor.",
          }
        - { name: categoria, in: query, schema: { type: string } }
        - {
            name: precoMin,
            in: query,
            schema: { type: number, minimum: 0 },
            description: Preço em euros.,
          }
        - {
            name: precoMax,
            in: query,
            schema: { type: number, minimum: 0 },
            description: Preço em euros.,
          }
        - { name: bio, in: query, schema: { type: boolean } }
        - {
            name: avaliacaoMin,
            in: query,
            schema: { type: number, minimum: 1, maximum: 5 },
            description: Média mínima das avaliações públicas do produto. Exclui produtos sem avaliações públicas quando usado.,
          }
        - {
            name: epoca,
            in: query,
            schema: { type: string },
            description:
              "Primavera (primavera), verão (verao), outono e inverno incluem produtos de todo-o-ano. Todo-o-ano
              seleciona apenas produtos disponíveis todo o ano.",
          }
        - {
            name: localidade,
            in: query,
            schema: { type: string, maxLength: 100 },
          }
        - { name: produtorId, in: query, schema: { type: string } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 24 },
          }
      responses:
        "200":
          description: Página de produtos; valores monetários são cêntimos inteiros
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Product" },
                    }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Produtos]
      security: [{ bearerAuth: [] }]
      summary: Cria um produto para o produtor autenticado e aprovado
      description:
        "Papel: produtor aprovado. Exige aprovação atual na base de dados. Produtores pendentes ou rejeitados
        recebem 403 sem criar o produto."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCreateInput" }
      responses:
        "201":
          description: Produto criado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /products/filters:
    get:
      tags: [Produtos]
      summary: Opções de filtros de todo o catálogo público de produtores aprovados
      description:
        Valores únicos e ordenados alfabeticamente. Apenas produtores e localidades com produtos publicados são
        incluídos.
      responses:
        "200":
          description: Opções independentes da pesquisa e paginação
          content:
            application/json:
              schema:
                type: object
                required: [categorias, produtores, localidades]
                properties:
                  categorias: { type: array, items: { type: string } }
                  localidades: { type: array, items: { type: string } }
                  produtores:
                    type: array
                    items:
                      type: object
                      required: [id, nome]
                      properties:
                        id: { type: string }
                        nome: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"
  /products/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Produtos]
      summary: Obtém um produto publicado de produtor aprovado
      responses:
        "200":
          {
            description: Produto público,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Produtos]
      security: [{ bearerAuth: [] }]
      summary: Atualiza um produto pertencente ao produtor autenticado e aprovado
      description:
        "Papel: produtor aprovado. PUT admite atualização parcial. Alterar stock ou unidade exige ausência de
        quantidades com reservaStock reservada em leilões; caso contrário devolve 409. Lotes já atribuídos ao vencedor
        não bloqueiam esta edição. Os restantes campos podem ser editados."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          {
            description: Produto atualizado,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Produtos]
      security: [{ bearerAuth: [] }]
      summary: Apaga um produto pertencente ao produtor autenticado e aprovado
      description:
        "Papel: produtor aprovado. Produtos com leilões associados, incluindo terminados, não podem ser apagados. A
        verificação e eliminação são transacionais e sincronizadas com a criação de leilões; requer MongoDB com suporte
        a transações (replica set)."
      responses:
        "204": { description: Produto apagado }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /producers:
    get:
      tags: [Produtores]
      summary: Lista produtores aprovados sem expor morada privada
      responses:
        "200":
          description: Produtores aprovados
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Producer" },
                }
        "500":
          $ref: "#/components/responses/InternalError"
  /producers/pendentes:
    get:
      tags: [Produtores]
      security: [{ bearerAuth: [] }]
      summary: Lista registos pendentes para análise por um administrador
      responses:
        "200":
          description: Produtores pendentes, incluindo dados de contacto e da exploração
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/PendingProducer" },
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          $ref: "#/components/responses/InternalError"
      description: "Papel: administrador."
  /producers/{id}/validacao:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Produtores]
      security: [{ bearerAuth: [] }]
      summary: Aprova ou rejeita um produtor ainda pendente como administrador
      description:
        "Papel: administrador. A primeira decisão resolve o registo pendente. Repetições ou uma decisão anterior
        desatualizada devolvem 409. Motivo obrigatório ao rejeitar (1–500 caracteres). decisaoAnterior é a data ISO
        observada ou null se ainda não existir (também o valor por omissão). Não exige novo JWT do produtor."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerValidationInput"
      responses:
        "200":
          description: Validação atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Decisão já resolvida ou desatualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /producers/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Produtores]
      summary: Obtém o perfil público, produtos e avaliações de um produtor aprovado
      responses:
        "200":
          {
            description: Perfil público do produtor,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ProducerDetail" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          $ref: "#/components/responses/InternalError"
  /orders:
    get:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Lista as encomendas próprias; o administrador pode consultar todas
      responses:
        "200":
          {
            description: Lista de encomendas,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Order" },
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          $ref: "#/components/responses/InternalError"
      description: "Papel: comprador, produtor ou administrador."
    post:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Cria uma encomenda por produtor e reserva todo o stock numa transação
      description:
        "Papel: comprador. Aceita vários produtores, todos aceites. Cria todas as encomendas e reserva todo o stock
        numa única transação; uma falha reverte a operação completa. A resposta é sempre uma lista, mesmo para um único
        produtor, com Location /api/orders. Consolida linhas repetidas e guarda nome, preço e unidade calculados pelo
        servidor; campos de preço enviados pelo cliente são ignorados. Produtos ou produtor indisponíveis e stock
        insuficiente devolvem 409, sem reserva parcial."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateInput"
      responses:
        "201":
          description: Encomendas criadas
          headers:
            Location:
              schema:
                type: string
              description: /api/orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Obtém uma encomenda própria ou qualquer encomenda como administrador
      responses:
        "200":
          {
            description: Encomenda,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Order" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          $ref: "#/components/responses/InternalError"
      description: "Papel: comprador, produtor ou administrador."
  /orders/{id}/reviews:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Avaliações]
      security: [{ bearerAuth: [] }]
      summary: Consulta as avaliações do comprador numa encomenda própria
      description:
        "Papel: comprador. Exclusivo do comprador da encomenda. Inclui avaliações publicadas, ocultas e
        denunciadas, para reconhecer alvos já avaliados."
      responses:
        "200":
          description: Avaliações do comprador nesta encomenda
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/entrega:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: O vencedor de um leilão escolhe como receber o lote
      description:
        "Papel: comprador. Apenas o comprador da encomenda de leilão ainda pendente e sem modalidade pode escolher.
        Grava a modalidade e avança atomicamente para confirmada. Um segundo pedido recebe 409."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDeliveryInput"
      responses:
        "200":
          {
