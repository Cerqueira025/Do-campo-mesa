  /orders/{id}/estado:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Avança a encomenda própria para o estado seguinte
      description:
        "Papel: produtor. A atualização é atómica e condicionada ao estado anterior. Um pedido ultrapassado por
        outro recebe 409 sem alterar a encomenda. A transição para entregue grava dataEntrega na mesma operação; estados
        não podem recuar nem saltar etapas. Uma encomenda de leilão sem modalidade aguarda a escolha do comprador e não
        pode ser avançada pelo produtor."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStateInput"
      responses:
        "200":
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /reviews:
    post:
      tags: [Avaliações]
      security: [{ bearerAuth: [] }]
      summary: Avalia um produto ou produtor de uma encomenda entregue própria
      description:
        'Papel: comprador. Cada comprador pode avaliar uma vez cada produto e uma vez o produtor de cada encomenda
        entregue que lhe pertence. Uma nova encomenda permite avaliar novamente os mesmos alvos. Repetir o mesmo alvo na
        mesma encomenda devolve 409 com a mensagem "Já avaliou este alvo nesta encomenda.", mesmo se a avaliação estiver
        oculta ou denunciada. A avaliação original não é alterada. Um índice único na base de dados impede também
        pedidos simultâneos.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Avaliação criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewWithAuthor"
