        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/products/{id}/moderacao:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Administração]
      security: [{ bearerAuth: [] }]
      summary: Oculta ou repõe um produto completo sem alterar publicação ou stock
      description: >-
        Apenas administradores. Motivo obrigatório ao bloquear; a última decisão observada é comparada atomicamente.
        Repor não publica um produto despublicado pelo produtor. Leilões associados deixam de ser públicos; os ativos
        preservam lances e reservas e podem gerar encomenda ao fechar. Não cancela encomendas nem devolve stock
        diretamente. O motivo fica restrito à administração.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductModerationInput"
      responses:
        "200":
          description: Bloqueio atualizado
