    AdminAuction:
      type: object
      required:
        - _id
        - produtos
        - lote
        - precoBase
        - incremento
        - dataInicio
        - dataFim
        - estado
        - reservaStock
        - licitacaoAtual
        - produtorId
        - visivel
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
        produtorId:
