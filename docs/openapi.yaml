        desempata a ordenação. Referências removidas podem ser null.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: estado
          in: query
          schema:
            type: string
            enum:
              - pendente
              - confirmada
              - pronta
              - entregue
          description: Estado válido para o recurso consultado
        - name: origem
          in: query
          schema:
            type: string
            enum:
              - catalogo
              - leilao
        - name: produtorId
          in: query
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
        - name: compradorId
          in: query
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        "200":
          description: Página administrativa de encomendas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/auctions:
    get:
      tags:
        - Administração
      security:
        - bearerAuth: []
      summary: Lista administrativa paginada de leilões
      description:
        Exige o papel atual administrador e inclui recursos ocultos. Pesquisa q literal, sem distinguir maiúsculas.
        Filtros desconhecidos, repetidos ou incompatíveis devolvem 400. page é ajustada à última página disponível; sem
        resultados devolve page 1 e items vazio. Pesquisa por lote ou nome do produtor; dataFim ascendente, usando o
        estado efetivo. O ID desempata a ordenação. Referências removidas podem ser null.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: estado
          in: query
          schema:
            type: string
            enum:
              - agendado
              - ativo
              - terminado
              - cancelado
          description: Estado válido para o recurso consultado
        - name: produtorId
          in: query
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
      responses:
        "200":
          description: Página administrativa de leilões
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuctionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/auctions/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - Administração
      security:
        - bearerAuth: []
      summary: Detalhe administrativo de leilões
      description:
        Inclui recursos ocultos e referências resolvidas; referências removidas podem ser null. Inclui produtos,
        visibilidade pública e as últimas vinte licitações, da mais recente para a mais antiga.
      responses:
        "200":
          description: Detalhe administrativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuctionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    backofficeSecret:
      type: apiKey
      in: header
      name: X-Backoffice-Secret
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
  responses:
    BadRequest:
      description:
        Dados ou parâmetros inválidos, incluindo corpo ausente ou que não seja objeto JSON, JSON malformado e
        formatos de query inválidos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Autenticação necessária ou inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Papel ou propriedade sem permissão
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflito de dados, estado ou stock
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Corpo do pedido excede 100 kB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Falha interna inesperada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Auction:
      type: object
      required:
        - _id
        - produtos
        - lote
        - precoBase
        - incremento
        - dataInicio
        - dataFim
        - estado
        - reservaStock
        - licitacaoAtual
      properties:
        _id:
          type: string
        produtorId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Producer"
        produtos:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - produtoId
              - quantidade
              - unidade
            properties:
              produtoId:
                type: object
                required:
                  - _id
                  - nome
                properties:
                  _id:
                    type: string
                  nome:
                    type: string
                  descricao:
                    type: string
              quantidade:
                type: number
                minimum: 0
                exclusiveMinimum: true
              unidade:
                type: string
                enum:
                  - kg
                  - g
                  - l
                  - unidade
        lote:
          type: string
        precoBase:
          type: integer
          minimum: 0
          description: Preço do lote completo em cêntimos.
        incremento:
          type: integer
          minimum: 1
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
        estado:
          type: string
          enum:
            - agendado
            - ativo
            - terminado
            - cancelado
        reservaStock:
          type: string
          enum:
            - pendente
            - reservada
            - libertada
            - atribuida
            - sem-reserva
        motivoCancelamento:
          type: string
          enum:
            - stock-insuficiente
            - produto-indisponivel
            - produtor-indisponivel
        licitacaoAtual:
          type: object
          properties:
            valor:
              type: integer
              minimum: 0
            compradorId:
              type: string
              nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resultado:
          type: object
          required:
            - vencedor
            - vencedorId
            - vencedorNome
            - valor
            - encomendaId
          properties:
            vencedor:
              type: boolean
            vencedorId:
              type: string
              nullable: true
            vencedorNome:
              type: string
              nullable: true
            valor:
              type: integer
              minimum: 0
            encomendaId:
              type: string
              nullable: true
          description: Presente apenas no detalhe de leilões terminados; a lista e a criação não incluem resultado.
    Error:
      type: object
      required: [erro]
      properties:
        erro: { type: string }
      example:
        erro: Autenticação necessária.
    UserPublic:
      type: object
      required: [id, nome, email, papel]
      properties:
        id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        papel: { type: string, enum: [comprador, produtor, administrador] }
        validacao: { type: string, enum: [pendente, aceite, rejeitado] }
    RegisterInput:
      type: object
      required: [nome, email, password]
      properties:
        nome: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        password:
          {
            type: string,
            format: password,
            minLength: 8,
            maxLength: 72,
            description: Máximo de 72 bytes em UTF-8.,
          }
        papel: { type: string, enum: [comprador, produtor], default: comprador }
        perfilProdutor:
          description: Obrigatório quando papel é produtor. Novas contas ficam pendentes; um estado enviado pelo cliente é ignorado.
          type: object
          required: [localidade, morada, coordenadas]
          properties:
            descricao: { type: string }
            localidade: { type: string }
            morada: { type: string }
            coordenadas:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      oneOf:
        - properties:
            papel:
              type: string
              enum:
                - comprador
        - required:
            - papel
            - perfilProdutor
          properties:
            papel:
              type: string
              enum:
                - produtor
    PendingProducer:
      type: object
      required: [_id, nome, email, perfilProdutor]
      properties:
        _id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        perfilProdutor:
          allOf:
            - $ref: "#/components/schemas/RegisterInput/properties/perfilProdutor"
            - type: object
              properties:
                validacao: { type: string, enum: [pendente] }
        createdAt: { type: string, format: date-time }
    Producer:
      type: object
      properties:
        _id: { type: string }
        nome: { type: string }
        perfilProdutor:
          type: object
          properties:
            descricao: { type: string }
            localidade: { type: string }
            coordenadas:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
        produtos: { type: integer }
        avaliacao: { $ref: "#/components/schemas/RatingSummary" }
        createdAt:
          type: string
          format: date-time
    ProducerDetail:
      type: object
      properties:
        _id: { type: string }
        nome: { type: string }
        perfilProdutor:
          { $ref: "#/components/schemas/Producer/properties/perfilProdutor" }
        produtos:
          { type: array, items: { $ref: "#/components/schemas/Product" } }
        avaliacoes: { $ref: "#/components/schemas/PublicReviews" }
        createdAt:
          type: string
          format: date-time
    ProductCreateInput:
      allOf:
        - { $ref: "#/components/schemas/ProductInput" }
        - type: object
          required: [nome, descricao, categoria, preco, unidade, stock]
    ProductInput:
      type: object
      description:
        Campos editáveis do produto; PUT admite atualização parcial. Na criação, ProductCreateInput acrescenta os
        campos obrigatórios.
      properties:
        nome:
          type: string
          pattern: \S
        descricao:
          type: string
          pattern: \S
        categoria:
          type: string
          pattern: \S
        preco:
          type: integer
          minimum: 0
          description: Cêntimos.
        unidade:
          type: string
          enum:
            - kg
            - g
            - l
            - unidade
        stock:
          type: number
          minimum: 0
        epoca:
          type: array
          items:
            type: string
        biologico:
          type: boolean
        dataValidade:
          type: string
          format: date-time
          nullable: true
        publicado:
          type: boolean
      example:
        nome: Produto de teste Swagger
        descricao: Produto descartável para demonstrar a API.
        categoria: Hortícolas
        preco: 240
        unidade: kg
        stock: 10
        biologico: true
    Product:
      allOf:
        - { $ref: "#/components/schemas/ProductInput" }
        - type: object
          properties:
            _id: { type: string }
            produtorId:
              description: ID no catálogo embebido no perfil do produtor; objeto público nas operações de produtos.
              oneOf:
                - $ref: "#/components/schemas/ObjectId"
                - $ref: "#/components/schemas/Producer"
            avaliacao: { $ref: "#/components/schemas/RatingSummary" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Delivery:
      type: object
      required: [tipo]
      description: Para entrega, a morada é obrigatória e deve conter texto após remover espaços nas extremidades.
      oneOf:
        - properties:
            tipo: { type: string, enum: [levantamento] }
        - required: [morada]
          properties:
            tipo: { type: string, enum: [entrega] }
            morada: { type: string, pattern: '\S' }
      properties:
        tipo: { type: string, enum: [levantamento, entrega] }
        morada: { type: string }
        dataPrevista: { type: string, format: date-time }
    RatingSummary:
      type: object
      required: [media, total]
      description:
        Apenas avaliações publicadas. Sem avaliações devolve media null e total 0. Média arredondada a duas casas;
        filtros usam a média antes do arredondamento.
      properties:
        media: { type: number, nullable: true, minimum: 1, maximum: 5 }
        total: { type: integer, minimum: 0 }
    PublicReview:
      type: object
      required: [_id, autorId, classificacao, comentario, createdAt]
      properties:
        _id: { type: string }
        autorId:
          type: object
          nullable: true
          properties:
            _id: { type: string }
            nome: { type: string }
        classificacao: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string }
        createdAt: { type: string, format: date-time }
    PublicReviews:
      allOf:
        - { $ref: "#/components/schemas/RatingSummary" }
        - type: object
          required: [items]
          properties:
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/PublicReview" },
              }
    Review:
      allOf:
        - $ref: "#/components/schemas/ReviewData"
        - type: object
          required:
            - autorId
          properties:
            autorId:
              $ref: "#/components/schemas/ObjectId"
      description: Avaliação própria da encomenda, com autor referenciado pelo ID.
    Order:
      type: object
      properties:
        _id: { type: string }
        compradorId:
          oneOf:
            - { type: string }
            - { $ref: "#/components/schemas/OrderParticipant" }
        produtorId:
          oneOf:
            - { type: string }
            - { $ref: "#/components/schemas/OrderParticipant" }
        estado: { type: string, enum: [pendente, confirmada, pronta, entregue] }
        total: { type: integer, description: Cêntimos. }
        entrega:
          allOf: [{ $ref: "#/components/schemas/Delivery" }]
          description: Ausente enquanto o vencedor do leilão não escolhe a modalidade.
        leilaoId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dataEntrega: { type: string, format: date-time }
        linhas:
          type: array
          items:
            type: object
            properties:
              produtoId: { type: string }
              nome: { type: string }
              precoUnitario:
                {
                  type: integer,
                  description: Cêntimos. Ausente nas linhas de leilão; o total é o preço do lote.,
                }
              quantidade: { type: number, minimum: 0, exclusiveMinimum: true }
              unidade: { type: string, enum: [kg, g, l, unidade] }
    OrderParticipant:
      type: object
      nullable: true
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        nome:
          type: string
      required:
        - _id
        - nome
    ObjectId:
      type: string
      pattern: ^[a-fA-F0-9]{24}$
      example: dca000000000000000000065
      description: Identificador MongoDB. Substituir pelos IDs devolvidos nas consultas da API.
    ProducerProfile:
      description: Obrigatório quando papel é produtor. Novas contas ficam pendentes; um estado enviado pelo cliente é ignorado.
      type: object
      required:
        - localidade
        - morada
        - coordenadas
        - validacao
      properties:
        descricao:
          type: string
        localidade:
          type: string
        morada:
          type: string
        coordenadas:
          type: object
          required:
            - latitude
            - longitude
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
        validacao:
          type: string
          enum:
            - pendente
            - aceite
            - rejeitado
    ReviewData:
      type: object
      properties:
        _id:
          type: string
        encomendaId:
          type: string
        produtoId:
          type: string
        produtorId:
          type: string
        classificacao:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
        estado:
          type: string
          enum:
            - publicada
            - oculta
            - denunciada
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - _id
        - encomendaId
        - classificacao
        - comentario
        - estado
        - createdAt
        - updatedAt
    ReviewWithAuthor:
      allOf:
        - $ref: "#/components/schemas/ReviewData"
        - type: object
          required:
            - autorId
          properties:
            autorId:
              $ref: "#/components/schemas/OrderParticipant"
      description: Resposta de criação ou moderação, com autor resolvido (ou null se removido).
    AdminDecision:
      type: object
      required:
        - administradorId
        - data
        - motivo
      properties:
        administradorId:
          $ref: "#/components/schemas/OrderParticipant"
        data:
          type: string
          format: date-time
        motivo:
          type: string
          maxLength: 500
    AdminProducerReference:
      type: object
      required:
        - _id
        - nome
        - papel
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        nome:
          type: string
        papel:
          type: string
          enum:
            - comprador
            - produtor
            - administrador
        perfilProdutor:
          type: object
          properties:
            localidade:
              type: string
            validacao:
              type: string
              enum:
                - pendente
                - aceite
                - rejeitado
      nullable: true
    AdminProductReference:
      type: object
      required:
        - _id
        - nome
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        nome:
          type: string
      nullable: true
    AdminUser:
      type: object
      required:
        - _id
        - nome
        - email
        - papel
        - createdAt
        - updatedAt
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        nome:
          type: string
        email:
          type: string
          format: email
        papel:
          type: string
          enum:
            - comprador
            - produtor
            - administrador
        perfilProdutor:
          $ref: "#/components/schemas/ProducerProfile"
        ultimaDecisao:
          $ref: "#/components/schemas/AdminDecision"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminProduct:
      allOf:
        - $ref: "#/components/schemas/ProductCreateInput"
        - type: object
          required:
            - _id
            - produtorId
            - visivel
            - createdAt
            - updatedAt
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            produtorId:
              $ref: "#/components/schemas/AdminProducerReference"
            bloqueado:
              type: boolean
            visivel:
              type: boolean
            ultimaDecisao:
              $ref: "#/components/schemas/AdminDecision"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AdminReview:
      type: object
      description:
        Autor, produto, produtor e autores das denúncias são resolvidos; encomendaId mantém o ID. Referências
        resolvidas removidas podem ser null.
      required:
        - _id
        - encomendaId
        - classificacao
        - comentario
        - estado
        - createdAt
        - updatedAt
        - autorId
        - denuncias
        - totalDenuncias
      properties:
        _id:
          type: string
        encomendaId:
          type: string
        produtoId:
          $ref: "#/components/schemas/AdminProductReference"
        produtorId:
          $ref: "#/components/schemas/AdminProducerReference"
        classificacao:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
        estado:
          type: string
          enum:
            - publicada
            - oculta
            - denunciada
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        autorId:
          $ref: "#/components/schemas/OrderParticipant"
        ultimaDecisao:
          $ref: "#/components/schemas/AdminDecision"
        denuncias:
          type: array
          items:
            type: object
            required:
              - autorId
              - motivo
              - data
            properties:
              autorId:
                $ref: "#/components/schemas/OrderParticipant"
              motivo:
                type: string
              data:
                type: string
                format: date-time
        totalDenuncias:
          type: integer
          minimum: 0
    AdminOrder:
      type: object
      required:
        - _id
        - compradorId
        - produtorId
        - linhas
        - total
        - estado
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
        compradorId:
          $ref: "#/components/schemas/OrderParticipant"
        produtorId:
          $ref: "#/components/schemas/AdminProducerReference"
        estado:
          type: string
          enum:
            - pendente
            - confirmada
            - pronta
            - entregue
        total:
          type: integer
          minimum: 0
          description: Cêntimos.
        entrega:
          allOf:
            - $ref: "#/components/schemas/Delivery"
          description: Ausente enquanto o vencedor do leilão não escolhe a modalidade.
        leilaoId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dataEntrega:
          type: string
          format: date-time
        linhas:
          type: array
          minItems: 1
          items:
            type: object
            required: [produtoId, nome, quantidade, unidade]
            properties:
              produtoId:
                type: string
              nome:
                type: string
              precoUnitario:
                type: integer
                description: Cêntimos. Ausente nas linhas de leilão; o total é o preço do lote.
              quantidade:
                type: number
                minimum: 0
                exclusiveMinimum: true
              unidade:
                type: string
                enum:
                  - kg
                  - g
                  - l
