openapi: 3.0.3
info:
  title: Do Campo à Mesa API
  version: 1.0.0
  description: >-
    API REST para autenticação, catálogo, encomendas, avaliações e leilões.
    O registo de produtor fica sempre pendente, independentemente de aprovações enviadas pelo cliente.
    Produtores pendentes ou rejeitados podem iniciar sessão e consultar a conta, mas recebem 403
    ao criar, alterar ou apagar produtos e ao criar leilões. A aprovação atual é consultada na base
    de dados em cada pedido protegido, sem exigir novo login após uma decisão administrativa.
    Produtos, perfis e leilões de produtores não aceites são omitidos das listas públicas e devolvem
    404 no detalhe. Aprovar novamente repõe a visibilidade dos conteúdos elegíveis; a decisão não
    elimina documentos nem cancela leilões, incluindo os terminados.
    Pedidos POST, PUT e PATCH exigem um corpo que seja um objeto JSON; corpo ausente,
    null, arrays e valores primitivos devolvem 400. Um objeto vazio passa pela validação dos
    campos da operação. Campos desconhecidos mantêm o comportamento de cada endpoint.
    Em rotas protegidas, a validação comum do corpo ocorre depois da autenticação e autorização.
    O parser JSON é global: sintaxe inválida é rejeitada com 400 antes dessas verificações.
    As respostas de erro preservam o formato { erro: string }; falhas internas inesperadas devolvem 500.
servers:
  - url: http://localhost:3000/api
tags:
  - name: Saúde
  - name: Autenticação
  - name: Produtos
  - name: Produtores
  - name: Encomendas
  - name: Avaliações
  - name: Leilões
paths:
  /health:
    get:
      tags: [Saúde]
      summary: Verifica se a API está disponível
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Regista um comprador ou produtor pendente de aprovação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Inicia sessão e devolve um JWT válido por duas horas
      description: Produtores pendentes ou rejeitados também podem iniciar sessão; o login não concede aprovação para publicar produtos ou criar leilões.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema:
                type: object
                required: [token, utilizador]
                properties:
                  token: { type: string }
                  utilizador: { $ref: "#/components/schemas/UserPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/recuperar-password:
    post:
      tags: [Autenticação]
      summary: Substitui a password pelo email na demonstração universitária
      description: Fluxo simplificado, sem autenticação, envio de email ou token de recuperação. Conhecer o email permite alterar a password da conta. Não é adequado para utilização pública real. Altera apenas o hash da password; os JWT já emitidos continuam válidos até expirar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password:
                  {
                    type: string,
                    format: password,
                    minLength: 8,
                    maxLength: 72,
                    description: Máximo de 72 bytes em UTF-8.,
                  }
      responses:
        "200":
          description: Password atualizada, sem devolver dados da conta ou sessão
          content:
            application/json:
              schema:
                type: object
                required: [mensagem]
                properties:
                  mensagem: { type: string, example: Palavra-passe atualizada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/eu:
    get:
      tags: [Autenticação]
      security: [{ bearerAuth: [] }]
      summary: Valida a sessão e devolve os dados atuais da conta
      description: Consulta a conta na base de dados, incluindo o estado atual de aprovação de produtores pendentes, aceites ou rejeitados. Tokens expirados, inválidos ou de contas removidas devolvem 401. Nunca devolve passwords ou hashes.
      responses:
        "200":
          description: Utilizador autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /products:
    get:
      tags: [Produtos]
      summary: Pesquisa produtos publicados de produtores aprovados
      description: >-
        Cada parâmetro conhecido aceita um único valor; parâmetros repetidos devolvem 400.
        Filtros numéricos vazios, não finitos ou preços cuja conversão em cêntimos exceda o limite
        de inteiro seguro devolvem 400. page e limit exigem dígitos decimais positivos, com limit
        até 100; page e o deslocamento (page - 1) * limit não podem exceder 9007199254740991.
        Parâmetros omitidos mantêm os defaults. q, categoria, localidade, epoca e produtorId
        vazios são ignorados; q composto apenas por espaços devolve 400. Parâmetros desconhecidos são ignorados.
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Pesquisa sem distinção de maiúsculas em produto,
            categoria e produtor.,
          }
        - { name: categoria, in: query, schema: { type: string } }
        - {
            name: precoMin,
            in: query,
            schema: { type: number, minimum: 0 },
            description: Preço em euros.,
          }
        - {
            name: precoMax,
            in: query,
            schema: { type: number, minimum: 0 },
            description: Preço em euros.,
          }
        - { name: bio, in: query, schema: { type: boolean } }
        - {
            name: avaliacaoMin,
            in: query,
            schema: { type: number, minimum: 1, maximum: 5 },
            description: Média mínima das avaliações públicas do produto. Exclui produtos sem avaliações públicas quando usado.,
          }
        - {
            name: epoca,
            in: query,
            schema: { type: string },
            description: Primavera (primavera),
            verão (verao),
            outono e inverno incluem produtos de todo-o-ano. Todo-o-ano seleciona apenas produtos disponíveis todo o ano.,
          }
        - {
            name: localidade,
            in: query,
            schema: { type: string, maxLength: 100 },
          }
        - { name: produtorId, in: query, schema: { type: string } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 24 },
          }
      responses:
        "200":
          description: Página de produtos; valores monetários são cêntimos inteiros
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Product" },
                    }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Produtos]
      security: [{ bearerAuth: [] }]
      summary: Cria um produto para o produtor autenticado e aprovado
      description: Exige aprovação atual na base de dados. Produtores pendentes ou rejeitados recebem 403 sem criar o produto.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Produto criado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /products/filters:
    get:
      tags: [Produtos]
      summary: Opções de filtros de todo o catálogo público de produtores aprovados
      description: Valores únicos e ordenados alfabeticamente. Apenas produtores e localidades com produtos publicados são incluídos.
      responses:
        "200":
          description: Opções independentes da pesquisa e paginação
          content:
            application/json:
              schema:
                type: object
                required: [categorias, produtores, localidades]
                properties:
                  categorias: { type: array, items: { type: string } }
                  localidades: { type: array, items: { type: string } }
                  produtores:
                    type: array
                    items:
                      type: object
                      required: [id, nome]
                      properties:
                        id: { type: string }
                        nome: { type: string }
  /products/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Produtos]
      summary: Obtém um produto publicado de produtor aprovado
      responses:
        "200":
          {
            description: Produto público,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Produtos]
      security: [{ bearerAuth: [] }]
      summary: Atualiza um produto pertencente ao produtor autenticado e aprovado
      description: Alterar stock ou unidade exige ausência de quantidades reservadas ou atribuídas a leilões; caso contrário devolve 409. Os restantes campos podem ser editados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          {
            description: Produto atualizado,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Produtos]
      security: [{ bearerAuth: [] }]
      summary: Apaga um produto pertencente ao produtor autenticado e aprovado
      description: Produtos com leilões associados, incluindo terminados, não podem ser apagados. A verificação e eliminação são transacionais e sincronizadas com a criação de leilões; requer MongoDB com suporte a transações (replica set).
      responses:
        "204": { description: Produto apagado }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /producers:
    get:
      tags: [Produtores]
      summary: Lista produtores aprovados sem expor morada privada
      responses:
        "200":
          description: Produtores aprovados
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Producer" },
                }
  /producers/pendentes:
    get:
      tags: [Produtores]
      security: [{ bearerAuth: [] }]
      summary: Lista registos pendentes para análise por um administrador
      responses:
        "200":
          description: Produtores pendentes, incluindo dados de contacto e da exploração
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/PendingProducer" },
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /producers/{id}/validacao:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Produtores]
      security: [{ bearerAuth: [] }]
      summary: Aprova ou rejeita um produtor como administrador
      description: A decisão é consultada na base de dados nas operações protegidas e consultas públicas seguintes; o produtor não precisa de um novo JWT. A rejeição oculta os produtos, o perfil e todos os leilões, incluindo terminados, sem eliminar documentos ou cancelar leilões. Voltar a aprovar repõe a visibilidade dos conteúdos que cumpram as restantes condições públicas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [validacao]
              properties:
                validacao: { type: string, enum: [aceite, rejeitado] }
      responses:
        "200":
          description: Validação atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /producers/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Produtores]
      summary: Obtém o perfil público, produtos e avaliações de um produtor aprovado
      responses:
        "200": { description: Perfil público do produtor }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders:
    get:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Lista as encomendas próprias; o administrador pode consultar todas
      responses:
        '200': { description: Lista de encomendas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Cria uma encomenda por produtor e reserva todo o stock numa transação
      description: Aceita vários produtores, todos aceites. Cria todas as encomendas e reserva todo o stock numa única transação; uma falha reverte a operação completa. A resposta é sempre uma lista, mesmo para um único produtor, com Location /api/orders. Consolida linhas repetidas e guarda nome, preço e unidade calculados pelo servidor; campos de preço enviados pelo cliente são ignorados. Produtos ou produtor indisponíveis e stock insuficiente devolvem 409, sem reserva parcial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linhas, entrega]
              properties:
                linhas:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [produtoId, quantidade]
                    properties:
                      produtoId: { type: string }
                      quantidade: { type: number, exclusiveMinimum: 0 }
                entrega: { $ref: '#/components/schemas/Delivery' }
      responses:
        '201': { description: Encomendas criadas, headers: { Location: { schema: { type: string }, description: /api/orders } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Obtém uma encomenda própria ou qualquer encomenda como administrador
      responses:
        "200":
          {
            description: Encomenda,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Order" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/reviews:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Avaliações]
      security: [{ bearerAuth: [] }]
      summary: Consulta as avaliações do comprador numa encomenda própria
      description: Exclusivo do comprador da encomenda. Inclui avaliações publicadas, ocultas e denunciadas, para reconhecer alvos já avaliados.
      responses:
        '200':
          description: Avaliações do comprador nesta encomenda
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/estado:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Encomendas]
      security: [{ bearerAuth: [] }]
      summary: Avança a encomenda própria para o estado seguinte
      description: A atualização é atómica e condicionada ao estado anterior. Um pedido ultrapassado por outro recebe 409 sem alterar a encomenda. A transição para entregue grava dataEntrega na mesma operação; estados não podem recuar nem saltar etapas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [confirmada, pronta, entregue] }
      responses:
        "200": { description: Estado atualizado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /reviews:
    post:
      tags: [Avaliações]
      security: [{ bearerAuth: [] }]
      summary: Avalia um produto ou produtor de uma encomenda entregue própria
      description: >-
        Cada comprador pode avaliar uma vez cada produto e uma vez o produtor de cada encomenda
        entregue que lhe pertence. Uma nova encomenda permite avaliar novamente os mesmos alvos.
        Repetir o mesmo alvo na mesma encomenda devolve 409 com a mensagem
        "Já avaliou este alvo nesta encomenda.", mesmo se a avaliação estiver oculta ou denunciada.
        A avaliação original não é alterada. Um índice único na base de dados impede também pedidos simultâneos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encomendaId, classificacao, comentario]
              properties:
                encomendaId: { type: string }
                produtoId: { type: string }
                produtorId: { type: string }
                classificacao: { type: integer, minimum: 1, maximum: 5 }
                comentario: { type: string }
      responses:
        "201": { description: Avaliação criada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /reviews/products/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Avaliações]
      summary: Lista avaliações públicas de um produto
      responses:
        "200": { description: Avaliações e média }
        "404": { $ref: "#/components/responses/NotFound" }
  /reviews/producers/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Avaliações]
      summary: Lista avaliações públicas de um produtor
      responses:
        "200": { description: Avaliações e média }
        "404": { $ref: "#/components/responses/NotFound" }
  /reviews/{id}/moderacao:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Avaliações]
      security: [{ bearerAuth: [] }]
      summary: Publica ou oculta uma avaliação como administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [publicada, oculta] }
      responses:
        "200": { description: Avaliação moderada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auctions:
    get:
      tags: [Leilões]
      summary: Lista leilões públicos, opcionalmente filtrados pelo estado efetivo
      description: >-
        A ativação exige estado ativo e reservaStock reservada, dentro do intervalo de datas.
        Um leilão pendente continua agendado até confirmação da reserva pelo servidor.
        A partir de dataFim é apresentado como terminado; cancelado prevalece sobre as datas.
        O filtro usa estas mesmas regras. O processamento transacional ocorre no arranque
        e com intervalo de cinco segundos após cada ciclo, incluindo o tempo de processamento.
        Exige todos os produtos existentes e publicados, pertencentes ao produtor do leilão, e produtor atualmente aprovado. Se uma linha estiver indisponível, o lote completo é omitido.
        Leilões indisponíveis são omitidos; os terminados continuam públicos se cumprirem estas condições.
        A consulta não altera os documentos guardados. Valores de estado repetidos ou desconhecidos devolvem 400.
      parameters:
        - {
            name: estado,
            in: query,
            schema:
              { type: string, enum: [agendado, ativo, terminado, cancelado] },
          }
      responses:
        "200":
          {
            description: Lista de leilões,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Auction" },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Leilões]
      security: [{ bearerAuth: [] }]
      summary: Cria um leilão com um ou vários produtos próprios de produtor aprovado
      description: Exige lista não vazia de produtos distintos, publicados e pertencentes ao produtor autenticado. Cada quantidade deve ser positiva e não exceder o stock; a unidade vem do produto, ignorando valores enviados pelo cliente. Preço base e licitações aplicam-se ao lote completo. Exige aprovação atual na base de dados; produtores pendentes ou rejeitados recebem 403. O servidor guarda agendado com reservaStock pendente; valores de estado, reserva e motivo enviados pelo cliente são ignorados. Datas devem ser strings válidas, com fim posterior ao início e ao instante do pedido. A reserva integral ocorre no início; falta de stock ou indisponibilidade cancela o lote sem desconto parcial. Fim sem vencedor devolve a reserva uma vez, com vencedor mantém quantidades atribuídas. A associação dos produtos e a criação do leilão são transacionais e coordenadas com a eliminação de produtos; requer MongoDB com suporte a transações (replica set).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [produtos, lote, precoBase, incremento, dataInicio, dataFim]
              properties:
                produtos:
                  type: array
                  minItems: 1
                  description: Produtos distintos do mesmo produtor, na ordem de apresentação do lote.
                  items:
                    type: object
                    required: [produtoId, quantidade]
                    properties:
                      produtoId: { type: string }
                      quantidade: { type: number, exclusiveMinimum: 0 }
                lote: { type: string }
                precoBase: { type: integer, minimum: 0, description: Cêntimos. }
                incremento:
                  { type: integer, minimum: 1, description: Cêntimos. }
                dataInicio: { type: string, format: date-time }
                dataFim: { type: string, format: date-time }
      responses:
        "201":
          {
            description: Leilão criado,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Auction" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auctions/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Leilões]
      summary: Obtém um leilão e os dados públicos do lote e produtor
      description: Devolve o estado efetivo com as mesmas regras da listagem. Um identificador inválido, leilão inexistente, produto apagado, despublicado ou de outro produtor, ou produtor removido ou não aprovado devolve 404. A consulta não altera o documento guardado.
      responses:
        "200":
          {
            description: Leilão,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Auction" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Dados ou parâmetros inválidos, incluindo corpo ausente ou que não seja objeto JSON, JSON malformado e formatos de query inválidos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Autenticação necessária ou inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Papel ou propriedade sem permissão
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflito de dados, estado ou stock
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Auction:
      type: object
      required:
        [
          _id,
          produtos,
          lote,
          precoBase,
          incremento,
          dataInicio,
          dataFim,
          estado,
          reservaStock,
          licitacaoAtual,
        ]
      properties:
        _id: { type: string }
        produtorId:
          oneOf:
            - { type: string }
            - { $ref: "#/components/schemas/Producer" }
        produtos:
          type: array
          minItems: 1
          items:
            type: object
            required: [produtoId, quantidade, unidade]
            properties:
              produtoId:
                type: object
                required: [_id, nome]
                properties:
                  _id: { type: string }
                  nome: { type: string }
                  descricao: { type: string }
              quantidade: { type: number, exclusiveMinimum: 0 }
              unidade: { type: string, enum: [kg, g, l, unidade] }
        lote: { type: string }
        precoBase:
          {
            type: integer,
            minimum: 0,
            description: Preço do lote completo em cêntimos.,
          }
        incremento: { type: integer, minimum: 1 }
        dataInicio: { type: string, format: date-time }
        dataFim: { type: string, format: date-time }
        estado: { type: string, enum: [agendado, ativo, terminado, cancelado] }
        reservaStock:
          {
            type: string,
            enum: [pendente, reservada, libertada, atribuida, sem-reserva],
          }
        motivoCancelamento:
          {
            type: string,
            enum:
              [stock-insuficiente, produto-indisponivel, produtor-indisponivel],
          }
        licitacaoAtual:
          type: object
          properties:
            valor: { type: integer, minimum: 0 }
            compradorId: { type: string, nullable: true }
    Error:
      type: object
      required: [erro]
      properties:
        erro: { type: string }
    UserPublic:
      type: object
      required: [id, nome, email, papel]
      properties:
        id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        papel: { type: string, enum: [comprador, produtor, administrador] }
        validacao: { type: string, enum: [pendente, aceite, rejeitado] }
    RegisterInput:
      type: object
      required: [nome, email, password]
      properties:
        nome: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        password:
          {
            type: string,
            format: password,
            minLength: 8,
            maxLength: 72,
            description: Máximo de 72 bytes em UTF-8.,
          }
        papel: { type: string, enum: [comprador, produtor], default: comprador }
        perfilProdutor:
          description: Obrigatório quando papel é produtor. Novas contas ficam pendentes; um estado enviado pelo cliente é ignorado.
          type: object
          required: [localidade, morada, coordenadas]
          properties:
            descricao: { type: string }
            localidade: { type: string }
            morada: { type: string }
            coordenadas:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
    PendingProducer:
      type: object
      required: [_id, nome, email, perfilProdutor]
      properties:
        _id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        perfilProdutor:
          allOf:
            - $ref: "#/components/schemas/RegisterInput/properties/perfilProdutor"
            - type: object
              properties:
                validacao: { type: string, enum: [pendente] }
        createdAt: { type: string, format: date-time }
    Producer:
      type: object
      properties:
        _id: { type: string }
        nome: { type: string }
        perfilProdutor:
          type: object
          properties:
            descricao: { type: string }
            localidade: { type: string }
            coordenadas: { type: object }
        produtos: { type: integer }
        avaliacao: { type: object }
    ProductInput:
      type: object
      properties:
        nome: { type: string }
        descricao: { type: string }
        categoria: { type: string }
        preco: { type: integer, minimum: 0, description: Cêntimos. }
        unidade: { type: string, enum: [kg, g, l, unidade] }
        stock: { type: number, minimum: 0 }
        epoca: { type: array, items: { type: string } }
        biologico: { type: boolean }
        dataValidade: { type: string, format: date-time }
        publicado: { type: boolean }
    Product:
      allOf:
        - { $ref: "#/components/schemas/ProductInput" }
        - type: object
          properties:
            _id: { type: string }
            produtorId: { $ref: "#/components/schemas/Producer" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Delivery:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, enum: [levantamento, entrega] }
        morada: { type: string }
        dataPrevista: { type: string, format: date-time }
    Review:
      type: object
      properties:
        _id: { type: string }
        autorId: { type: string }
        encomendaId: { type: string }
        produtoId: { type: string }
        produtorId: { type: string }
        classificacao: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string }
        estado: { type: string, enum: [publicada, oculta, denunciada] }
        createdAt: { type: string, format: date-time }
    Order:
      type: object
      properties:
        _id: { type: string }
        compradorId:
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/OrderParticipant' }
        produtorId:
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/OrderParticipant' }
        estado: { type: string, enum: [pendente, confirmada, pronta, entregue] }
        total: { type: integer, description: Cêntimos. }
        entrega:
          allOf: [{ $ref: '#/components/schemas/Delivery' }]
        leilaoId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dataEntrega: { type: string, format: date-time }
        linhas:
          type: array
          items:
            type: object
            properties:
              produtoId: { type: string }
              nome: { type: string }
              precoUnitario: { type: integer, description: Cêntimos. }
              quantidade: { type: number, exclusiveMinimum: 0 }
              unidade: { type: string, enum: [kg, g, l, unidade] }
    OrderParticipant:
      type: object
      nullable: true
      properties:
        _id: { type: string }
        nome: { type: string }
