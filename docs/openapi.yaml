          type: string
          maxLength: 500
          description: Obrigatório e não vazio ao bloquear
        decisaoAnterior:
          type: string
          format: date-time
          nullable: true
          default: null
    AuctionInput:
      type: object
      required:
        - produtos
        - lote
        - precoBase
        - incremento
        - dataInicio
        - dataFim
      properties:
        produtos:
          type: array
          minItems: 1
          description: Produtos distintos do mesmo produtor, na ordem de apresentação do lote.
          items:
            type: object
            required:
              - produtoId
              - quantidade
            properties:
              produtoId:
                type: string
              quantidade:
                type: number
                minimum: 0
                exclusiveMinimum: true
        lote:
          type: string
        precoBase:
          type: integer
          minimum: 0
          description: Cêntimos.
        incremento:
          type: integer
          minimum: 1
          description: Cêntimos.
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
      example:
        produtos:
          - produtoId: dca000000000000000000065
            quantidade: 1
