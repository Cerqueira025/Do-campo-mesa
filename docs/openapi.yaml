    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      example:
        email: produtor@example.test
        password: CampoMesaDemo123!
      description: Exemplo de conta fictícia do seed. Ajustar a password se SEED_PASSWORD tiver sido alterada na criação da conta.
    PasswordResetInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Máximo de 72 bytes em UTF-8.
    OrderCreateInput:
      type: object
      required:
        - linhas
        - entrega
      properties:
        linhas:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - produtoId
              - quantidade
            properties:
              produtoId:
                type: string
              quantidade:
                type: number
                minimum: 0
                exclusiveMinimum: true
                description: Múltiplos de 1 unidade, 100 g ou 0,5 kg/l; mínimo igual ao passo. A unidade é obtida do produto.
        entrega:
          $ref: "#/components/schemas/Delivery"
      example:
        linhas:
          - produtoId: dca000000000000000000065
            quantidade: 1
        entrega:
          tipo: levantamento
    OrderDeliveryInput:
      type: object
      required:
        - entrega
      properties:
        entrega:
          $ref: "#/components/schemas/Delivery"
      description:
        Só tipo e morada são usados nesta operação; dataPrevista não é guardada. No levantamento, a morada vem do
        perfil do produtor e a sua ausência devolve 400.
    OrderStateInput:
      type: object
      required:
        - estado
      properties:
        estado:
          type: string
          enum:
            - pendente
            - confirmada
            - pronta
            - entregue
      description:
        Apenas a transição para o estado imediatamente seguinte é aceite; repetir o estado atual, recuar ou saltar
        etapas devolve 409.
    ReviewInput:
      type: object
      required:
        - encomendaId
        - classificacao
        - comentario
      properties:
        encomendaId:
          type: string
        produtoId:
          type: string
        produtorId:
          type: string
        classificacao:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          pattern: \S
      oneOf:
        - required:
            - produtoId
          not:
            required:
              - produtorId
        - required:
            - produtorId
          not:
            required:
              - produtoId
    ReviewReportInput:
      type: object
      required:
        - motivo
