        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A decisão anterior foi entretanto alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /auctions:
    get:
      tags: [Leilões]
      summary: Lista leilões públicos, opcionalmente filtrados pelo estado efetivo
      description: >-
        A ativação exige estado ativo e reservaStock reservada, dentro do intervalo de datas. Um leilão pendente
        continua agendado até confirmação da reserva pelo servidor. A partir de dataFim é apresentado como terminado;
        cancelado prevalece sobre as datas. O filtro usa estas mesmas regras. O processamento transacional ocorre no
        arranque e com intervalo de cinco segundos após cada ciclo, incluindo o tempo de processamento. Exige todos os
        produtos existentes e publicados, pertencentes ao produtor do leilão, e produtor atualmente aprovado. Se uma
        linha estiver indisponível, o lote completo é omitido. Leilões indisponíveis são omitidos; os terminados
        continuam públicos se cumprirem estas condições. A consulta não altera os documentos guardados. Valores de
        estado repetidos ou desconhecidos devolvem 400.
      parameters:
        - {
            name: estado,
            in: query,
            schema:
              { type: string, enum: [agendado, ativo, terminado, cancelado] },
          }
      responses:
        "200":
          {
            description: Lista de leilões,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Auction" },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Leilões]
      security: [{ bearerAuth: [] }]
      summary: Cria um leilão com um ou vários produtos próprios de produtor aprovado
      description:
        "Papel: produtor aprovado. Exige lista não vazia de produtos distintos, publicados e pertencentes ao
        produtor autenticado. Cada quantidade deve ser positiva e não exceder o stock; a unidade vem do produto,
        ignorando valores enviados pelo cliente. Preço base e licitações aplicam-se ao lote completo. Exige aprovação
        atual na base de dados; produtores pendentes ou rejeitados recebem 403. O servidor guarda agendado com
        reservaStock pendente; valores de estado, reserva e motivo enviados pelo cliente são ignorados. Datas devem ser
        strings válidas, com fim posterior ao início e ao instante do pedido. A reserva integral ocorre no início; falta
        de stock ou indisponibilidade cancela o lote sem desconto parcial. Fim sem vencedor devolve a reserva uma vez,
        com vencedor mantém quantidades atribuídas. A associação dos produtos e a criação do leilão são transacionais e
        coordenadas com a eliminação de produtos; requer MongoDB com suporte a transações (replica set)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionInput"
      responses:
        "201":
          {
            description: Leilão criado,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Auction" } },
              },
            headers:
              {
                Location:
                  {
                    description: "/api/auctions/{id}",
                    schema: { type: string },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
